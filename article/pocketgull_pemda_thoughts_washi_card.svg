<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="washiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <style>
      .title { font-family: "PocketGull", -apple-system, sans-serif; font-weight: bold; }
      .mono { font-family: "PocketGull Mono", "Courier New", monospace; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .braille { font-family: "DejaVu Sans", monospace; letter-spacing: 0.15em; font-weight: bold; }
    </style>
  </defs>

  <!-- Washi Paperboard Canvas -->
  <rect width="1200" height="1200" fill="url(#washiBg)"/>
  
  <!-- Outer Architectural Deckle Frame (Zero Pills) -->
  <rect x="30" y="30" width="1140" height="1140" fill="none" stroke="#E7E2D6" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="1128" fill="none" stroke="#E7E2D6" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Header Section -->
  <g transform="translate(70, 90)">
    <text x="0" y="55" class="title" font-size="58" fill="#1F1B16" letter-spacing="-0.02em">PEMDA<tspan fill="#0D9488">+</tspan> Thoughts:</text>
    <text x="0" y="95" class="body" font-size="20" fill="#57534E">The Cognitive Order of Operations in Clinical Lettering</text>
    
    <!-- Architectural Header Rule -->
    <line x1="0" y1="125" x2="1060" y2="125" stroke="#E7E2D6" stroke-width="1.5"/>
    <text x="1060" y="118" class="mono" font-size="12" fill="#78716C" text-anchor="end" font-weight="bold">PHIL GEAR // POCKETGULL SOVEREIGN SPECIMEN</text>
  </g>

  <!-- 6 Pillars Grid: 3 Columns x 2 Rows -->
  
  <!-- ================= ROW 1 ================= -->
  
  <!-- Pillar 1: (P) Primary Intent -->
  <g transform="translate(70, 250)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <!-- Top accent bar -->
    <line x1="0" y1="0" x2="335" y2="0" stroke="#0D9488" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#0D9488" font-weight="bold">(P) Primary Intent</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Physical Inking &amp; Baseline Breath</text>
    
    <!-- ECG Waveform in Celadon Teal -->
    <path d="M 24 130 L 70 130 L 80 100 L 90 155 L 102 75 L 115 140 L 125 130 L 170 130 L 180 115 L 190 130 L 220 130 L 230 100 L 242 160 L 255 80 L 268 138 L 278 130 L 311 130" 
          fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• The Human Touch</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">Broad-edge marker entry angles</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">on heavyweight cotton cardstock.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Parenthetical Containment</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">Organic baseline breathing room</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">before geometric expansion.</text>
  </g>

  <!-- Pillar 2: [E] Empirical Optics -->
  <g transform="translate(432, 250)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <line x1="0" y1="0" x2="335" y2="0" stroke="#0D9488" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#0D9488" font-weight="bold">[E] Empirical Optics</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Louise Sloan 5:1 Grid Invariant</text>
    
    <!-- Sloan 5:1 Optotype Target Diagram -->
    <g transform="translate(167, 125)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#E7E2D6" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#F6B12B" stroke-width="2"/>
      <line x1="-55" y1="0" x2="55" y2="0" stroke="#E7E2D6" stroke-width="0.8"/>
      <line x1="0" y1="-55" x2="0" y2="-55" stroke="#E7E2D6" stroke-width="0.8"/>
      <text x="0" y="4" class="mono" font-size="10" fill="#0D9488" text-anchor="middle" font-weight="bold">5:1</text>
    </g>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Snellen 20/20 Legibility</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">5-arcminute subtended angle</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">with 1-arcminute stroke weight.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Herman Bouma Spacing</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">0.12em anti-crowding geometry</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">for geriatric and ICU vision.</text>
  </g>

  <!-- Pillar 3: {M} Multi-Style Hierarchy -->
  <g transform="translate(795, 250)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <line x1="0" y1="0" x2="335" y2="0" stroke="#0D9488" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#0D9488" font-weight="bold">{M} Multi-Style</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Coordinated 4-Master System</text>
    
    <!-- 4 Styles Typographic Hierarchy -->
    <g transform="translate(24, 90)">
      <text x="0" y="20" class="title" font-size="18" fill="#1F1B16">Bold 700: Triage Warnings</text>
      <text x="0" y="44" class="body" font-size="15" fill="#57534E">Fineliner 400: Progress Notes</text>
      <text x="0" y="68" class="title" font-size="16" fill="#F6B12B">Chiseltip 900: Calligraphy</text>
      <text x="0" y="90" class="mono" font-size="14" fill="#0D9488">Mono 400: 600 UPM Vitals</text>
    </g>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Unified Metric Rhythm</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">Zero baseline wobble across</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">all four distinct master styles.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Fixed-Pitch Telemetry</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">Gapless box drawing and box</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">alignment for tabular vitals.</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Pillar 4: {D} Disambiguation Safety -->
  <g transform="translate(70, 650)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <line x1="0" y1="0" x2="335" y2="0" stroke="#EF6658" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#EF6658" font-weight="bold">{D} Disambiguation</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Zero Medication Dosing Errors</text>
    
    <!-- Disambiguation Glyph Trio -->
    <g transform="translate(30, 95)">
      <!-- Slashed Zero -->
      <rect x="0" y="0" width="70" height="65" fill="#FAF8F5" stroke="#E7E2D6" stroke-width="0.8"/>
      <text x="35" y="44" class="title" font-size="34" fill="#EF6658" text-anchor="middle">Ø</text>
      <text x="35" y="60" class="mono" font-size="8" fill="#78716C" text-anchor="middle">ZERO 0</text>
      
      <!-- Capital O -->
      <rect x="90" y="0" width="70" height="65" fill="#FAF8F5" stroke="#E7E2D6" stroke-width="0.8"/>
      <text x="125" y="44" class="title" font-size="34" fill="#1F1B16" text-anchor="middle">O</text>
      <text x="125" y="60" class="mono" font-size="8" fill="#78716C" text-anchor="middle">LETTER O</text>
      
      <!-- Curved l vs 1 vs I -->
      <rect x="180" y="0" width="90" height="65" fill="#FAF8F5" stroke="#E7E2D6" stroke-width="0.8"/>
      <text x="225" y="44" class="title" font-size="28" fill="#0D9488" text-anchor="middle">l 1 I</text>
      <text x="225" y="60" class="mono" font-size="8" fill="#78716C" text-anchor="middle">l vs 1 vs I</text>
    </g>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• ISMP / FDA Guidelines</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">Direct CDRH compliance for</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">life-critical drug administration.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Shielded Decimals</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">Never lose a decimal point: 0.5 mg</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">never mistaken for 5 mg.</text>
  </g>

  <!-- Pillar 5: (A) Accessibility -->
  <g transform="translate(432, 650)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <line x1="0" y1="0" x2="335" y2="0" stroke="#0D9488" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#0D9488" font-weight="bold">(A) Accessibility</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Complete 256 Unicode Braille</text>
    
    <!-- Braille Matrix Visual -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="270" height="65" fill="#FAF8F5" stroke="#E7E2D6" stroke-width="0.8"/>
      <text x="135" y="35" class="braille" font-size="20" fill="#0D9488" text-anchor="middle">⠏⠕⠉⠅⠑⠞⠛⠥⠇⠇</text>
      <text x="135" y="55" class="mono" font-size="9" fill="#78716C" text-anchor="middle">U+2800–28FF • ISO/TR 11548 TACTILE</text>
    </g>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Universal Multimodal</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">Embedded Braille across all weights</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">for pharmaceutical packaging.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Low-Vision Contrast</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">WCAG AAA 14.1:1 optical ratio</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">on high-glare clinical screens.</text>
  </g>

  <!-- Pillar 6: (+) The Human Touch -->
  <g transform="translate(795, 650)">
    <rect width="335" height="370" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <line x1="0" y1="0" x2="335" y2="0" stroke="#F6B12B" stroke-width="3"/>
    
    <text x="24" y="38" class="mono" font-size="16" fill="#F6B12B" font-weight="bold">(+) The Human Touch</text>
    <text x="24" y="62" class="body" font-size="13" fill="#78716C" font-style="italic">Organic Healing &amp; Empathy</text>
    
    <!-- Humanist Quote & Gull Emblem -->
    <g transform="translate(24, 95)">
      <text x="0" y="22" class="body" font-size="14" fill="#1F1B16" font-style="italic">“In a circle where empathy grows,</text>
      <text x="0" y="44" class="body" font-size="14" fill="#0D9488" font-style="italic">And care like a mountain stream flows...”</text>
    </g>
    
    <line x1="24" y1="180" x2="311" y2="180" stroke="#E7E2D6" stroke-width="0.8"/>
    
    <text x="24" y="210" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• De-Escalating Anxiety</text>
    <text x="34" y="232" class="body" font-size="12" fill="#57534E">Warm humanist curves reassure</text>
    <text x="34" y="250" class="body" font-size="12" fill="#57534E">anxious pediatric patients.</text>
    
    <text x="24" y="282" class="body" font-size="13" fill="#1F1B16" font-weight="bold">• Caregiver Dignity</text>
    <text x="34" y="304" class="body" font-size="12" fill="#57534E">Less cognitive friction during</text>
    <text x="34" y="322" class="body" font-size="12" fill="#57534E">exhausting 12-hour night shifts.</text>
  </g>

  <!-- Bottom Mathematical Summary Banner (Zero Pills) -->
  <g transform="translate(70, 1055)">
    <rect width="1060" height="60" fill="#FFFDF8" stroke="#E7E2D6" stroke-width="1"/>
    <text x="25" y="36" class="mono" font-size="12.5" fill="#1F1B16" font-weight="bold">
      <tspan fill="#0D9488">(P)</tspan> Intent → 
      <tspan fill="#0D9488">[E]</tspan> Optics → 
      <tspan fill="#0D9488">{M}</tspan> Hierarchy × 
      <tspan fill="#EF6658">{D}</tspan> Disambiguation → 
      <tspan fill="#0D9488">(A)</tspan> Accessibility → 
      <tspan fill="#F6B12B">(+)</tspan> Human Touch
    </text>
    <text x="1035" y="36" class="mono" font-size="11" fill="#78716C" text-anchor="end" font-weight="bold">WASHI PAPERCRAFT</text>
  </g>

</svg>
