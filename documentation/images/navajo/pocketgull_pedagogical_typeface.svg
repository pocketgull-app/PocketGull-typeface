          Bounded by Blanca Peak (East), Mount Taylor (South), San Francisco Peaks (West), and Hesperus Peak (North). From Canyon de Chelly’s sheer red sandstone spires to the sagebrush-scented breeze off high piñon mesas, health is living in sacred beauty (Hózhó).
          <br/><br/>
          <em style="color: #0D9488; font-weight: 600;">Traditional Ecological Knowledge (TEK):</em> Indigenous languages preserve micro-climate data, seasonal bird migrations, and botanical chemistry refined over millennia. PocketGull provides the high-legibility digital typography required to pass this knowledge across generations.
        </div>
      </foreignObject>
    </g>
