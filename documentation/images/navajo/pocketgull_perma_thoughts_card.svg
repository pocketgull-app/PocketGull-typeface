<?xml version="1.0" encoding="UTF-8"?>
<svg width="2400" height="2400" viewBox="0 0 2400 2400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .font-brand { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-native { font-family: 'PocketGull', 'PocketGull Bold', 'SansSerifCollection', sans-serif; }
    </style>
    <linearGradient id="permaBg_navajo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>

  <!-- Surface Paperboard -->
  <rect width="2400" height="2400" fill="url(#permaBg_navajo)"/>

  <!-- Tactile Frame -->
  <rect x="60" y="60" width="2280" height="2280" fill="none" stroke="#D6CEBF" stroke-width="2.5"/>
  <rect x="80" y="80" width="2240" height="2240" fill="none" stroke="#D6CEBF" stroke-width="1.2" stroke-dasharray="10,10"/>

  <!-- Card Header -->
  <g transform="translate(140, 160)">
    <text x="0" y="40" class="font-mono" font-size="28" font-weight="bold" fill="#64748B" letter-spacing="0.12em">PERMA+ HOLISTIC CLINICAL WELL-BEING &amp; SOVEREIGN TRADITION</text>
    <text x="0" y="125" class="font-brand" font-size="64" font-weight="800" fill="#0F172A">Diné Bizaad (Navajo)</text>
    <text x="0" y="185" class="font-native" font-size="42" font-weight="700" fill="#0D9488">Diné bi Bibeehazʼáanii • Navajo Nation • IHS Navajo Area</text>
    <line x1="0" y1="220" x2="2120" y2="220" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- 6 PERMA+ Pillar Cards -->
  <g transform="translate(140, 440)">

    <g transform="translate(0, 0)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#991B1B"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 01 • POSITIVE EMOTION</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Hózhó</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Walking in harmony, joy, and somatic equilibrium
          </div>
        </foreignObject>
      </g>
    </g>

    <g transform="translate(1080, 0)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#0D9488"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 02 • ENGAGEMENT</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Nitsáhákees</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Mindful dawn thinking and focused mental intention
          </div>
        </foreignObject>
      </g>
    </g>

    <g transform="translate(0, 540)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#991B1B"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 03 • RELATIONSHIPS</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Kʼé</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Sacred kinship, mutual compassion, and respectful relations
          </div>
        </foreignObject>
      </g>
    </g>

    <g transform="translate(1080, 540)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#0D9488"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 04 • MEANING</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Nahatʼá</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Life purpose guided by the teachings of the Holy People
          </div>
        </foreignObject>
      </g>
    </g>

    <g transform="translate(0, 1080)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#991B1B"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 05 • ACCOMPLISHMENT</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Iiná</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Active daily living with vigor, endurance, and fortitude
          </div>
        </foreignObject>
      </g>
    </g>

    <g transform="translate(1080, 1080)">
      <rect width="1040" height="480" rx="18" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
      <rect width="12" height="480" rx="6" fill="#0D9488"/>
      
      <g transform="translate(50, 70)">
        <text x="0" y="0" class="font-mono" font-size="24" font-weight="bold" fill="#64748B">PILLAR 06 • HEALTH VITALITY</text>
        <text x="0" y="65" class="font-native" font-size="52" font-weight="800" fill="#991B1B">Atsʼíís Baa Áháyą́</text>
        <foreignObject x="0" y="105" width="940" height="260">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.55;">
            Holistic care for the body through traditional foodways
          </div>
        </foreignObject>
      </g>
    </g>

  </g>

  <!-- Bottom Land & Resilience Epilogue -->
  <g transform="translate(140, 2140)">
    <rect width="2120" height="140" rx="12" fill="#0F172A"/>
    <text x="40" y="55" class="font-brand" font-size="28" font-weight="bold" fill="#F8FAFC">🏜️ THE FOUR SACRED MOUNTAINS & RED MESA SANCTUARIES</text>
    <text x="40" y="100" class="font-mono" font-size="20" fill="#94A3B8">POCKETGULL OPEN HEALTHCARE TYPOGRAPHY • DEDICATED TO TRIBAL WELL-BEING &amp; SELF-DETERMINATION</text>
  </g>
</svg>

