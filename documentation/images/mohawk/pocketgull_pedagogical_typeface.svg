        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.65;">
          Framed by the broad, clean waters of Kaniatarowanenneh and the ancient granite hills of the Adirondacks. Where the sweet sap of sugar maples flows in spring and the Great Tree of Peace spreads its white roots to the four corners of the earth, health begins with Words Before All Else (Ohenton Karihwatehkwen).
          <br/><br/>
          <em style="color: #15803D; font-weight: 600;">Traditional Ecological Knowledge (TEK):</em> Indigenous languages preserve micro-climate data, seasonal bird migrations, and botanical chemistry refined over millennia. PocketGull provides the high-legibility digital typography required to pass this knowledge across generations.
        </div>
      </foreignObject>
    </g>
  </g>

