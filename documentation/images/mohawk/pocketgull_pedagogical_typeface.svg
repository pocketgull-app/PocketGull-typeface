        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#581C87">Niawenhkó:wa</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">Great and profound thanks to you</text>
