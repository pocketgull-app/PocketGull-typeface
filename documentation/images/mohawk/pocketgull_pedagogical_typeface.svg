        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#581C87">Kahswénhta</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">Two Row Wampum belt signifying sovereign coexistence</text>
