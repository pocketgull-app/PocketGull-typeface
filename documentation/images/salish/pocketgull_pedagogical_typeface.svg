      <text x="0" y="210" class="font-native" font-size="40" font-weight="700" fill="#0F172A">ʔəshəliʔ: Life breath, spirit, and whole-body vitality. sʔuladxʷ: Wild salmon; the sacred sustenance of the river.</text>

      <text x="0" y="290" class="font-mono" font-size="22" font-weight="bold" fill="#64748B">3. POCKETGULL CHISELTIP (WEIGHT 900 PROPORTIONAL) — TRAUMA PLACARDS &amp; WAYFINDING</text>
      <text x="0" y="340" class="font-native" font-size="42" font-weight="900" fill="#0F172A">ʔəshəliʔ: Life breath, spirit, and whole-body vitality. sʔuladxʷ: Wild salmon; the sacred sustenance of the river.</text>

      <text x="0" y="420" class="font-mono" font-size="22" font-weight="bold" fill="#64748B">4. POCKETGULL MONO (600 UPM MEDICAL TERMINAL) — REAL-TIME BIOMETRIC READOUTS</text>
