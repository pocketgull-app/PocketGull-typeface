  <!-- Section 2: Bioregional Landscape & Flora Immersion -->
  <g transform="translate(160, 1300)">
    <text x="0" y="0" class="font-mono" font-size="30" font-weight="bold" fill="#475569">02 / WALKING THE LANDS &amp; NATURE WITHOUT TRAVELING</text>
    <rect y="30" width="2368" height="520" rx="16" fill="#FFFFFF" stroke="#E2DACB" stroke-width="2"/>
    <g transform="translate(60, 100)">
      <text x="0" y="0" class="font-title" font-size="44" font-weight="800" fill="#0369A1">🌊 THE SALISH SEA, SNOQUALMIE PLUME & THE GREAT CEDAR CANOPY</text>
      <foreignObject x="0" y="35" width="2240" height="360">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #334155; line-height: 1.65;">
          Where 800-year-old western redcedars drape with moss above churning tidal fiords. From Snoqualmie Falls plunging into emerald foam to the glaciated peak of Tahoma watching over the river deltas, the returning salmon sustain the life breath (ʔəshəliʔ).
          <br/><br/>
          <em style="color: #C2410C; font-weight: 600;">Traditional Ecological Knowledge (TEK):</em> Indigenous languages preserve micro-climate data, seasonal bird migrations, and botanical chemistry refined over millennia. PocketGull provides the high-legibility digital typography required to pass this knowledge across generations.
        </div>
      </foreignObject>
    </g>
  </g>

