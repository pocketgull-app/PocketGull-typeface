        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#0369A1">qʷəl̕qʷələb</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">The sacred killer whale (Orca) of the deep waters</text>
