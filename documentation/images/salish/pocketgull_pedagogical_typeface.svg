      <text x="0" y="80" class="font-native" font-size="38" font-weight="400" fill="#0F172A">ʔəshəliʔ: Life breath, spirit, and whole-body vitality. sʔuladxʷ: Wild salmon; the sacred sustenance of the river.</text>

