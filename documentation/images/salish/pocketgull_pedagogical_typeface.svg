  <rect x="712" y="80" width="632" height="12" fill="#C2410C"/>
  <rect x="1344" y="80" width="632" height="12" fill="#0F766E"/>
  <rect x="1976" y="80" width="632" height="12" fill="#1E293B"/>

  <!-- Broadside Header -->
  <g transform="translate(160, 220)">
    <text x="0" y="40" class="font-mono" font-size="28" font-weight="bold" fill="#64748B" letter-spacing="0.1em">POCKETGULL PEDAGOGICAL BROADSIDE • SOVEREIGN INDIGENOUS TYPOGRAPHY</text>
    <text x="0" y="130" class="font-title" font-size="72" font-weight="800" fill="#0F172A">dxʷləšucid (Lushootseed)</text>
