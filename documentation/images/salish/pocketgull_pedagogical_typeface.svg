        <rect width="1160" height="150" rx="12" fill="#FFFFFF" stroke="#E2DACB" stroke-width="1.8"/>
        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#0369A1">ʔalʔal</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">Traditional cedar longhouse and communal home</text>
      </g>

      <g transform="translate(0, 360)">
        <rect width="1160" height="150" rx="12" fill="#FFFFFF" stroke="#E2DACB" stroke-width="1.8"/>
        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#0369A1">dxʷləšucid</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">Puget Sound Salish ancestral language</text>
      </g>

      <g transform="translate(1210, 360)">
        <rect width="1160" height="150" rx="12" fill="#FFFFFF" stroke="#E2DACB" stroke-width="1.8"/>
        <text x="40" y="65" class="font-native" font-size="44" font-weight="bold" fill="#0369A1">Kanim</text>
        <text x="40" y="115" class="font-title" font-size="24" font-weight="600" fill="#475569">Dugout western redcedar canoe for ocean journeys</text>
      </g>

      <g transform="translate(0, 540)">
