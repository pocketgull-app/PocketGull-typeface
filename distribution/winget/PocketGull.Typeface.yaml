License: Apache-2.0
LicenseUrl: https://raw.githubusercontent.com/pocketgull-app/pocketgull-typeface/main/LICENSE.txt
ShortDescription: Clinical, optotypic, and telemetry typeface superfamily engineered for life-critical healthcare.
Description: |
  PocketGull is an open-source clinical sans-serif, display, and telemetry monospace
  typeface superfamily engineered by Phil Gear. Originating from tactile felt marker
  lettering created on physical cardstock for GearArts, PocketGull synthesizes humanist
  stroke warmth with Louise Sloan 5:1 optotypic legibility and Institute for Safe
  Medication Practices (ISMP) character disambiguation standards for life-critical
  healthcare environments.
