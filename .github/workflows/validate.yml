name: Google Fonts Quality Assurance & Fontbakery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fontbakery & Pre-Flight Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools fontbakery gftools

      - name: Run PocketGull Pre-Flight Validator
        run: |
          python sources/validate_fonts.py

      - name: Run Fontbakery (Google Fonts Profile)
        continue-on-error: true
        run: |
          fontbakery check-googlefonts \
            --loglevel WARN \
            --ghmarkdown fontbakery-report.md \
            fonts/ttf/*.ttf

      - name: Upload Fontbakery Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-qa-report
          path: fontbakery-report.md
