name: PocketGull Typographic Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate-typography:
    name: OpenType Spec & Precision Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Typographic Engineering Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools brotli pillow pytest

      - name: Compile Master Precision Vector Superfamily
        run: |
          python scripts/compile_precision_superfamily.py

      - name: Execute Automated Font Quality Test Suite (51 Invariant Checks)
        run: |
          pytest scripts/test_font_quality.py -v

      - name: Render High-Resolution Anti-Aliased Specimen Proof
        run: |
          python scripts/render_actual_font_proof.py

      - name: Upload Built Superfamily Binaries & Specimen
        uses: actions/upload-artifact@v7
        with:
          name: pocketgull-superfamily-release
          path: |
            *.ttf
            *.woff2
            PocketGull-Authentic-Specimen.png
