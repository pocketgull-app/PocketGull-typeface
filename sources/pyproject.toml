[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketgull-typeface"
version = "1.0.0"
description = "Caslon-Level Reproducible Antigravity Typeface Compiler"
authors = [
    { name = "PocketGull Authors", email = "philgear@gmail.com" }
]
license = "OFL-1.1"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.60.2",
    "fontbakery>=0.12.0",
    "cu2qu>=1.6.7",
    "pytest>=9.0.3",
    "brotli>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["scripts", "tests"]
python_files = ["test_*.py"]

[tool.uv.extra-build-dependencies]
cu2qu = ["setuptools<70"]
